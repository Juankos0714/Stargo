# Supabase local (CLI + Docker) — usado por la suite de RLS (Parte 2).
# Configuración mínima equivalente a la que genera `supabase init`.
# Ver: https://supabase.com/docs/guides/local-development

# El id del proyecto se usa en el nombre de los contenedores Docker.
project_id = "stargo"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326
admin_email = "admin@email.com"
sender_name = "Admin"

[auth]
enabled = true
site_url = "http://127.0.0.1:54321"
# URLs permitidas para los enlaces de recuperación de contraseña: el dev
# server (5173) y el preview de la suite de integración (4175).
additional_redirect_urls = [
	"http://127.0.0.1:5173",
	"http://127.0.0.1:5173/recuperar-clave",
	"http://127.0.0.1:4175",
	"http://127.0.0.1:4175/recuperar-clave"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = false

[realtime]
enabled = true

# Edge Function send-push (Fase 15): la llama el Database Webhook de Supabase
# SIN JWT de usuario (el webhook solo puede autenticarse con la firma del
# servicio, que no lleva token de usuario), así que verify_jwt = false.
[functions.send-push]
verify_jwt = false

# Los keys por defecto (anon/service_role) de Supabase local son públicos y
# fijos; se documentan en .env.test.example para la suite de RLS.
