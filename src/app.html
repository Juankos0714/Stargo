<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#001621" />
		<!-- PWA: Android/Chrome legacy + iOS Safari (Add to Home Screen) -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		<meta name="apple-mobile-web-app-title" content="StarGo" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<!-- Inter se auto-aloja (paquete @fontsource-variable/inter): sin CSS de
		     Google Fonts bloqueante en la ruta crítica ni dependencia de terceros. -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
