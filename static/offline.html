<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#001621" />
		<title>Sin conexión — StarGo</title>
		<style>
			:root {
				color-scheme: dark;
			}
			* {
				margin: 0;
				box-sizing: border-box;
			}
			body {
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #001621;
				color: #e2e8f0;
				font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
				text-align: center;
				padding: 24px;
			}
			.card {
				max-width: 420px;
			}
			img {
				width: 64px;
				height: 64px;
				border-radius: 14px;
				background: #0064ff;
				padding: 10px;
			}
			h1 {
				margin-top: 24px;
				font-size: 1.5rem;
				font-weight: 800;
				letter-spacing: -0.01em;
			}
			p {
				margin-top: 10px;
				font-size: 0.95rem;
				line-height: 1.55;
				color: #94a3b8;
			}
			a {
				display: inline-block;
				margin-top: 24px;
				padding: 12px 22px;
				border-radius: 12px;
				background: #1768ff;
				color: #fff;
				text-decoration: none;
				font-weight: 600;
				font-size: 0.95rem;
			}
		</style>
	</head>
	<body>
		<div class="card">
			<img src="/brand/stargo-mark-blue.svg" alt="StarGo" width="64" height="64" />
			<h1>Estás sin conexión</h1>
			<p>
				Revisa tu conexión a internet. Los pedidos y el seguimiento en vivo necesitan conexión;
				vuelve a intentarlo cuando estés en línea.
			</p>
			<a href="/">Reintentar</a>
		</div>
		<script>
			// Recarga automáticamente cuando vuelve la conexión.
			window.addEventListener('online', () => location.reload());
		</script>
	</body>
</html>
